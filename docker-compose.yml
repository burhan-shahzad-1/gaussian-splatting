services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gsplat
      POSTGRES_PASSWORD: gsplat
      POSTGRES_DB: gsplat
    ports:
      - "5434:5432"
    volumes:
      - gsplat_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gsplat -d gsplat"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: gsplat
      MINIO_ROOT_PASSWORD: gsplatgsplat
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    volumes:
      - gsplat_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 gsplat gsplatgsplat
        mc mb -p local/gsplat
        mc anonymous set download local/gsplat
        echo minio ready

  worker:
    profiles: ["gpu"]
    build: ./worker
    restart: unless-stopped
    gpus: all
    ports:
      - "8080:8080"
    env_file:
      - .env.local
    environment:
      APP_URL: http://host.docker.internal:3000
      WORK_DIR: /work
      STORAGE_BACKEND: s3
      OUTPUT_PREFIX: reconstructions
      SPLAT_BACKEND: gsplat
      GSPLAT_EXAMPLES_DIR: /opt/gsplat/examples
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - worker_scratch:/work

volumes:
  gsplat_pg:
  gsplat_minio:
  worker_scratch:
